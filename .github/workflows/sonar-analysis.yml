name: 🔍 SonarCloud Code Analysis

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
    types: [opened, synchronize, reopened]

jobs:
  sonarcloud:
    name: SonarCloud Analysis
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 Checkout Repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Shallow clones should be disabled for better analysis
    
    - name: 🟢 Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
    
    - name: 📦 Install Dependencies
      run: npm ci
    
    - name: 🧪 Run Tests with Coverage
      run: |
        # Add test coverage script if not exists
        if npm run test:coverage 2>/dev/null; then
          echo "✅ Tests with coverage completed"
        else
          echo "⚠️ No test coverage script found, running basic tests"
          npm test 2>/dev/null || echo "No tests configured yet"
        fi
    
    - name: 🔧 Build Project
      run: |
        npm run build:client || echo "⚠️ Client build not configured"
        npm run build:server || echo "⚠️ Server build not configured"
    
    # The scan needs a SONAR_TOKEN repository secret. Without one the scanner
    # fails with "Not authorized or organization not found", which is why this
    # job had never passed. SonarCloud's own automatic analysis (the separate
    # "SonarCloud Code Analysis" check) still scans every push and PR, so the
    # scan here is skipped instead of failing the build. The token stays
    # scoped to the two steps that need it.
    - name: 🔑 Check for SonarCloud token
      id: sonar-token
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      run: |
        if [ -n "$SONAR_TOKEN" ]; then
          echo "present=true" >> "$GITHUB_OUTPUT"
        else
          echo "present=false" >> "$GITHUB_OUTPUT"
          echo "::notice title=SonarCloud scan skipped::No SONAR_TOKEN secret is configured. SonarCloud automatic analysis still runs as the 'SonarCloud Code Analysis' check."
        fi

    - name: 📊 SonarCloud Scan
      if: steps.sonar-token.outputs.present == 'true'
      uses: SonarSource/sonarcloud-github-action@master
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # Needed to get PR information, if any
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}     # Generate a token on Sonarcloud.io
      with:
        args: >
          -Dsonar.projectKey=orbit-trails
          -Dsonar.organization=orbit-trails-org
          -Dsonar.projectName=Orbit\ Trails
          -Dsonar.sources=client,server,shared
          -Dsonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/*.spec.ts,**/*.test.ts
          -Dsonar.typescript.lcov.reportPaths=coverage/lcov.info
          -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info
