<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--
      Page-specific tags (title, description, canonical, Open Graph, Twitter,
      JSON-LD) are NOT hardcoded here any more. Each page declares them with
      <Seo />, and scripts/prerender.mjs writes them into the static HTML of
      every URL at build time. Hardcoding them here made every URL on the site
      announce the homepage's title and canonical to crawlers.
    -->
    <title>Orbit Trails</title>
    <meta name="author" content="Orbit Trails" />
    <meta name="theme-color" content="#24313f" />

    <link rel="icon" type="image/x-icon" href="/logo.ico" />

    <!-- Origins every page talks to -->
    <link rel="preconnect" href="https://images.orbittrails.com" />
    <link rel="preconnect" href="https://images.unsplash.com" />
    <link rel="dns-prefetch" href="https://api.orbittrails.com" />
    <link rel="dns-prefetch" href="https://www.googletagmanager.com" />

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-Q5PRKK6LJ3"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-Q5PRKK6LJ3');
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/client/entry-client.tsx"></script>
  </body>
</html>
