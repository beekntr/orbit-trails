<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--
      Page-specific tags (title, description, canonical, Open Graph, Twitter,
      JSON-LD) are NOT hardcoded here any more. Each page declares them with
      <Seo />, and scripts/prerender.mjs writes them into the static HTML of
      every URL at build time. Hardcoding them here made every URL on the site
      announce the homepage's title and canonical to crawlers.
    -->
    <title>Orbit Trails</title>
    <meta name="author" content="Orbit Trails" />
    <meta name="theme-color" content="#24313f" />

    <link rel="icon" type="image/x-icon" href="/logo.ico" />

    <!-- Origins every page talks to -->
    <link rel="preconnect" href="https://images.orbittrails.com" />
    <link rel="preconnect" href="https://images.unsplash.com" />
    <link rel="dns-prefetch" href="https://api.orbittrails.com" />
    <link rel="dns-prefetch" href="https://www.googletagmanager.com" />

    <!--
      Google tag with Consent Mode v2. Nothing that stores data is allowed until
      the visitor chooses in the cookie banner (client/components/consent).
      A choice saved on an earlier visit is applied here, before the first
      page view. The storage key must match CONSENT_STORAGE_KEY in lib/consent.ts.
    -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('consent', 'default', {
        ad_storage: 'denied',
        ad_user_data: 'denied',
        ad_personalization: 'denied',
        analytics_storage: 'denied',
        wait_for_update: 500
      });
      gtag('set', 'ads_data_redaction', true);
      try {
        var saved = JSON.parse(localStorage.getItem('ot_consent_v1') || 'null');
        if (saved) {
          var ads = saved.marketing ? 'granted' : 'denied';
          gtag('consent', 'update', {
            analytics_storage: saved.analytics ? 'granted' : 'denied',
            ad_storage: ads, ad_user_data: ads, ad_personalization: ads
          });
        }
      } catch (e) {}
      gtag('js', new Date());
      gtag('config', 'G-JBJKNEKFVM');
    </script>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-JBJKNEKFVM"></script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/client/entry-client.tsx"></script>
  </body>
</html>
